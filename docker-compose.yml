services:
  mysql:
    image: mysql:8.0
    container_name: databasestudent
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadminstudent
    restart: always
    ports:
      - "8687:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: appuser
      PMA_PASSWORD: password
    depends_on:
      - mysql
    networks:
      - app-network

  app:
    image: natvannak/phpapp:${PHP_APP_VERSION:-1.0.0}
    container_name: webappstudent
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "8686:80"
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysqldata:

networks:
  app-network:
    driver: bridge